name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install viewer dependencies
        working-directory: viewer
        run: bun install --frozen-lockfile

      - name: Build viewer
        working-directory: viewer
        # `bun run build` invokes the `prebuild` hook (`bun run data` →
        # scripts/aggregate.ts) which regenerates viewer/public/events.json
        # from every editions/<N>/events.json before Vite bundles, so the
        # deployed bundle is always in sync with the archive.
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
